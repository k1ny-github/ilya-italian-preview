<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Рабочий сайт — Б2 на разных ширинах</title><style>
*{box-sizing:border-box}body{margin:0;background:#edf4fa;color:#192c40;font:16px/1.5 Arial,sans-serif}header{background:white;padding:16px 20px;border-bottom:1px solid #cbddea}h1{font-size:22px;margin:0 0 4px}p{margin:4px 0 12px}nav{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}button,a{font:inherit}button{padding:8px 12px;border:1px solid #aac8e0;border-radius:8px;background:white;color:#0758c2;cursor:pointer}button[aria-pressed=true]{color:white;background:#0868ee}button:focus-visible,a:focus-visible{outline:3px solid #ed9c38;outline-offset:3px}.stage{padding:20px;overflow:auto}iframe{display:block;width:360px;height:calc(100vh - 240px);min-height:560px;border:0;background:white;margin-inline:auto;box-shadow:0 8px 24px #244a6a18}.link{color:#0758c2}
</style><header><h1>Рабочий сайт — проверка секций</h1><p>Внутри — опубликованная версия сайта без уменьшения масштаба.</p><nav aria-label="Ширина сайта"><button data-width="320" aria-pressed="false">320 px</button><button data-width="360" aria-pressed="true">360 px</button><button data-width="480" aria-pressed="false">480 px</button><button data-width="640" aria-pressed="false">640 px</button><button data-width="960" aria-pressed="false">960 px</button><button data-width="1200" aria-pressed="false">1200 px</button></nav><nav aria-label="Секция"><button data-section="audience" aria-pressed="true">Кому подойдут занятия</button><button data-section="approach" aria-pressed="false">Мой подход</button><button data-section="culture" aria-pressed="false">Погружение в культуру</button><button data-section="booking" aria-pressed="false">Запись</button><button data-section="quiz" aria-pressed="false">Тест</button><button data-section="about" aria-pressed="false">Обо мне</button><a class="link" href="../index.html#audience" target="_blank" rel="noopener">Открыть сайт отдельно</a></nav><span id="width-label">Ширина сайта:360px</span><p id="width-notice" role="status"></p></header><main class="stage"><iframe id="site" title="Действующий сайт Ильи Хорькова" src="../index.html#audience"></iframe></main><script>
const frame=document.getElementById('site');
const widthButtons=[...document.querySelectorAll('[data-width]')];
widthButtons.forEach(b=>b.onclick=()=>{frame.style.width=b.dataset.width+'px';document.getElementById('width-label').textContent='Ширина сайта:'+b.dataset.width+'px';document.getElementById('width-notice').textContent='';widthButtons.forEach(x=>x.setAttribute('aria-pressed',x===b));const url=new URL(location.href);url.searchParams.set('width',b.dataset.width);history.replaceState(null,'',url)});
document.querySelectorAll('[data-section]').forEach(b=>b.onclick=()=>{frame.src='../index.html#'+b.dataset.section;const url=new URL(location.href);url.searchParams.set('section',b.dataset.section);history.replaceState(null,'',url);document.querySelector('a.link').href=frame.src;document.querySelectorAll('[data-section]').forEach(x=>x.setAttribute('aria-pressed',x===b))});
const params=new URLSearchParams(location.search);
[...document.querySelectorAll('[data-section]')].find(b=>b.dataset.section===params.get('section'))?.click();
if(params.has('width')){
 const raw=params.get('width'),requested=Number(raw),valid=Number.isFinite(requested)&&requested>0;
 const selected=valid?widthButtons.reduce((a,b)=>Math.abs(Number(b.dataset.width)-requested)<Math.abs(Number(a.dataset.width)-requested)?b:a):widthButtons.find(b=>b.dataset.width==='360');
 selected.click();
 if(raw!==selected.dataset.width)document.getElementById('width-notice').textContent=valid?'Запрошено '+raw+' px. Показана ближайшая доступная ширина: '+selected.dataset.width+' px.':'Некорректная ширина. Показано 360 px.';
}
</script></html>
