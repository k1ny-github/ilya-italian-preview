<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Сравнение вариантов</title><link rel="stylesheet" href="ui.css"><body class="natural"><header><div class="wrap"><p class="eyebrow"><a href="index.html">← Все варианты</a></p><h1 id="title"></h1><p id="description" class="intro"></p><div class="controls"><label>Вариант<select id="choice"></select></label><button id="compare" aria-pressed="false">Сравнить два</button><label id="secondLabel" hidden>Сравнить с<select id="second"></select></label></div><div class="controls" id="widths"><button data-width="natural" aria-pressed="true">Мой экран</button></div><nav class="links"><a class="link-button primary" id="direct" target="_blank">Открыть вариант на весь экран</a><a class="link-button" href="../../index.html">Полный сайт</a></nav><p id="note" class="note" style="margin-top:16px"></p></div></header><div class="stage"><div class="frames" id="frames"><article class="frame-box"><h2 id="name1"></h2><iframe id="frame1" title="Выбранный вариант"></iframe></article><article class="frame-box" id="box2" hidden><h2 id="name2"></h2><iframe id="frame2" title="Второй вариант"></iframe></article></div></div><script src="catalog.js"></script><script>const group=catalog.find(g=>g.id===new URLSearchParams(location.search).get('group'))||catalog[0];const q=s=>document.querySelector(s);q('#title').textContent=group.title;q('#description').textContent=group.description;document.title=group.title+' — сравнение';for(const [i,v]of group.variants.entries()){for(const id of ['#choice','#second']){const o=document.createElement('option');o.value=i;o.textContent=v.label+' · '+v.status;q(id).append(o)}}q('#choice').value=group.id==='hero'?4:0;q('#second').value=group.variants.length>1?1:0;let comparing=false;function render(){const a=group.variants[q('#choice').value],b=group.variants[q('#second').value];q('#frame1').src=a.url;q('#name1').textContent=a.label;q('#direct').href=a.url;q('#note').textContent=a.status+'. '+a.note;q('#box2').hidden=!comparing;q('#secondLabel').hidden=!comparing;q('#frames').classList.toggle('compare',comparing);if(comparing){q('#frame2').src=b.url;q('#name2').textContent=b.label}}q('#choice').onchange=render;q('#second').onchange=render;q('#compare').onclick=()=>{comparing=!comparing;q('#compare').setAttribute('aria-pressed',comparing);render()};for(const w of [320,360,480,640,960,1200]){const b=document.createElement('button');b.dataset.width=w;b.textContent=w+' px';b.setAttribute('aria-pressed','false');q('#widths').append(b)}q('#widths').onclick=e=>{const b=e.target.closest('button');if(!b)return;document.body.classList.toggle('natural',b.dataset.width==='natural');document.documentElement.style.setProperty('--frame-width',b.dataset.width+'px');q('#widths').querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b))};render();</script></body></html>
